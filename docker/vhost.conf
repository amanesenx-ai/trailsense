<VirtualHost *:10000>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    # Only public/ is served; source, config, tests and docs are outside the document root.
    Header always set Strict-Transport-Security "max-age=31536000"
    PassEnv DATABASE_URL WEATHER_PROVIDER APP_DEBUG BASE_URL
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
