openapi: 3.0.3
info:
  title: TrailSense API
  version: "1.0"
  description: Read-only API of TrailSense. Routes © OpenStreetMap contributors; forecast Open-Meteo; warnings IPMA.
servers:
  - url: https://amanesenx.alwaysdata.net/api/v1
paths:
  /trails:
    get:
      summary: List trails
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: difficulty, in: query, schema: {type: string, enum: [easy, moderate, hard]}}
        - {name: max_km, in: query, schema: {type: number, minimum: 0}}
      responses:
        "200": {description: Trails, content: {application/json: {schema: {$ref: '#/components/schemas/TrailList'}}}}
        "400": {$ref: '#/components/responses/Error'}
  /trails/{id}:
    get:
      summary: One trail with GeoJSON route, photos and recent reports
      parameters: [{name: id, in: path, required: true, schema: {type: integer}}]
      responses:
        "200": {description: Trail}
        "404": {$ref: '#/components/responses/Error'}
  /trails/{id}/conditions:
    get:
      summary: Risk check for a hike window (not stored)
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: date, in: query, required: true, schema: {type: string, format: date}}
        - {name: start, in: query, schema: {type: string, pattern: '^\d{2}:\d{2}$', default: '09:00'}}
        - {name: duration, in: query, schema: {type: integer, minimum: 30, maximum: 720}}
      responses:
        "200": {description: "Conditions with rule results, verdict {key, title, reason}, forecast.hourly (time, temp, precip, gust, code, description, in_window) and sources {api, page, ipma}"}
        "400": {$ref: '#/components/responses/Error'}
        "404": {$ref: '#/components/responses/Error'}
  /group-hikes:
    get:
      summary: Upcoming group hikes
      responses: {"200": {description: Group hikes}}
  /feed:
    get:
      summary: Latest published hikes
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}]
      responses:
        "200": {description: Posts}
        "400": {$ref: '#/components/responses/Error'}
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: object, properties: {status: {type: integer}, message: {type: string}}}
  schemas:
    Point: {type: object, properties: {lat: {type: number}, lon: {type: number}}}
    Trail:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        ref: {type: string, example: PR2 VLG}
        region: {type: string}
        distance_km: {type: number}
        elevation_gain_m: {type: integer}
        estimated_duration_min: {type: integer}
        difficulty: {type: string, enum: [easy, moderate, hard]}
        loop: {type: boolean}
        start: {$ref: '#/components/schemas/Point'}
        end: {$ref: '#/components/schemas/Point'}
    TrailList:
      type: object
      properties:
        count: {type: integer}
        data: {type: array, items: {$ref: '#/components/schemas/Trail'}}
